name: Build README from TeX

on:
  push:
    paths:
      - '**.tex'
    branches:
      - main

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate README.md from manual.tex
        run: |
          pandoc manual.tex -f latex -t gfm --toc -o README.md

      - name: Commit and push updated README.md
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update README.md from manual.tex" && git push)
